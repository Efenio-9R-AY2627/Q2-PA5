<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>

    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
    
    <div class="container mt-3">


    <form action="" method="post">

        <h2 class="text-center text-primary">Order a <strong><i>Custom</i></strong> Sneaker!</h2>

        <label for="form-name" class="form-label"><strong>Name:</strong></label> 
        <input type="text" name="username" id="form-name" class="form-control">
        <br>
    
        <label for="form-email" class="form-label"><strong>Email:</strong></label> 
        <input type="email" name="emailaddress" id="form-email"class="form-control">
        <br>

        <label for="form-tel" class="form-label"><strong>Telephone:</strong></label> 
        <input type="tel" name="telephone" id="form-tel"class="form-control">
        <br>

        <label for="form-story" class="form-label"><strong>Tell us about yourself!</strong></label> 
        <textarea name="story" maxlength="600" id="form-story" placeholder="Not more than 600 characters long" class="form-control"></textarea>
        <br>
        
        <label for="sizes"><strong>Size:</strong></label>
        <select name="size" id="sizes" class="form-control">
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
        </select> 
        
        <em>(sizes reflect standard US men's sizes)</em>
        <br>
            
        <label for="colors"></label>
        <fieldset id="colors">
            <legend><div class="rainbow-text">
	        <strong><span class="block-line"><span><span style="color:#ff0000">C</span><span style="color:#ccff00">o</span><span style="color:#00ff66">l</span><span style="color:#0066ff">o</span><span style="color:#cc00ff">r</span></span></span></strong>
            </div></legend>
            <div class="form-check text-danger">
                <label><input type="radio" name="color" value="red" class="form-check-input"> Red</label>
            </div>
            <div class="form-check text-primary">
                <label><input type="radio" name="color" value="blue" class="form-check-input"> Blue</label>
            </div>
            <div class="form-check text-dark">
                <label><input type="radio" name="color" value="black" class="form-check-input"> Black</label>
            </div>
            <div class="form-check text-secondary">
                <label><input type="radio" name="color" value="silver" class="form-check-input"> Silver</label>
            </div>
        </fieldset>
            
        <label for="features"></label>
        <fieldset id="features">
            <legend><strong>Add-on Features</strong></legend>
            <div class="form-check">
                <label><input type="checkbox" name="feature" value="laces" class="form-check-input"> Sparkley laces</label>
            </div>
            <div class="form-check">
                <label><input type="checkbox" name="feature" value="logo" class="form-check-input"> Metallic logo</label>
            </div>
            <div class="form-check">
                <label><input type="checkbox" name="feature" value="heels" class="form-check-input"> Light-up heels</label>
            </div>
            <div class="form-check">
                <label><input type="checkbox" name="feature" value="mp3" class="form-check-input"> MP3-enabled</label>
            </div>
        </fieldset>
        <br>
            
        <input type="submit" value="ORDER!!!" class="btn btn-primary">
    </form>
</div>

</body>
</html>
